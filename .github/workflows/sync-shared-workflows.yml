name: Sync Shared Workflows

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync shared workflows
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHARED_REPO="RealPage/gh-aw-shared-workflows"
          WORKFLOWS_DIR=".github/workflows"
          SHARED_WORKFLOWS=(prd-generation decomposition skill-selection mcp-selection validation)

          changed=false
          for workflow in "${SHARED_WORKFLOWS[@]}"; do
            echo "Fetching ${workflow}.md..."
            content=$(gh api "repos/${SHARED_REPO}/contents/workflows/${workflow}.md" --jq '.content' | base64 -d)
            target="${WORKFLOWS_DIR}/${workflow}.md"

            if [ -f "${target}" ]; then
              existing=$(cat "${target}")
              if [ "${content}" = "${existing}" ]; then
                echo "  ${workflow}.md is up to date"
                continue
              fi
            fi

            echo "${content}" > "${target}"
            echo "  ${workflow}.md updated"
            changed=true
          done

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Compile workflows
        if: steps.sync.outputs.changed == 'true'
        run: gh aw compile

      - name: Create PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="sync/shared-workflows-$(date +%Y%m%d)"
          git checkout -b "${branch}"
          git add .github/workflows/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync shared agentic workflows from gh-aw-shared-workflows"
          git push -u origin "${branch}"
          gh pr create \
            --title "Sync shared agentic workflows" \
            --body "$(cat <<'BODY'
          ## Summary

          Automated sync of shared workflows from [gh-aw-shared-workflows](https://github.com/RealPage/gh-aw-shared-workflows).

          After merging, run `gh aw compile` locally to regenerate lock files.
          BODY
          )"
